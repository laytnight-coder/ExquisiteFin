name: Build theme

on:
  push:
    branches: [main]
    paths:
      - 'Theme/source/**'
      - 'scripts/build_theme.py'
      - '.github/workflows/build-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build theme bundles
        run: python3 scripts/build_theme.py --check && python3 scripts/build_theme.py

      - name: Commit generated bundles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Theme/ExquisiteFin.css Theme/ExquisiteFin-MediaBar.css
          git diff --cached --quiet || git commit -m 'Build ExquisiteFin theme bundles'
          git push
